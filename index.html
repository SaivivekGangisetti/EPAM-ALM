<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth System with LocalStorage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .auth-container {
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        .form-toggle {
            cursor: pointer;
            color: #0d6efd;
            text-decoration: underline;
        }

        .error-message {
            color: #dc3545;
            font-size: 0.875em;
            margin-top: 0.25rem;
        }

        body {
            background: url('https://res.cloudinary.com/dasm9k1z9/video/upload/v1706845125/wjlymhfjxiqtc7qn1nqi.mp4');
        }

        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        .auth-container {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }
    </style>
</head>

<body>
    <video autoplay loop muted playsinline id="bg-video">
        <source src="https://res.cloudinary.com/dasm9k1z9/video/upload/v1706845125/wjlymhfjxiqtc7qn1nqi.mp4"
            type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <div class="container">
        <div class="auth-container bg-white">
            <h2 class="text-center mb-4" id="form-title">Sign Up</h2>

            <form id="signup-form">
                <div class="mb-3">
                    <label for="signup-name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="signup-name" required>
                    <div class="error-message" id="name-error"></div>
                </div>
                <div class="mb-3">
                    <label for="signup-email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="signup-email" required>
                    <div class="error-message" id="email-error"></div>
                </div>
                <div class="mb-3">
                    <label for="signup-password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="signup-password" required>
                    <div class="error-message" id="password-error"></div>
                </div>
                <div class="mb-3">
                    <label for="signup-confirm-password" class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="signup-confirm-password" required>
                    <div class="error-message" id="confirm-password-error"></div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Sign Up</button>
            </form>

            <form id="signin-form" style="display: none;">
                <div class="mb-3">
                    <label for="signin-email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="signin-email" required>
                    <div class="error-message" id="signin-email-error"></div>
                </div>
                <div class="mb-3">
                    <label for="signin-password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="signin-password" required>
                    <div class="error-message" id="signin-password-error"></div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Sign In</button>
            </form>

            <div class="text-center mt-3">
                <span id="toggle-form-text">Already have an account? <span class="form-toggle">Sign In</span></span>
            </div>

            <div class="alert mt-3" id="auth-alert" style="display: none;"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>

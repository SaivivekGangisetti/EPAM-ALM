<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auth System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    overflow:hidden;
    font-family:Arial;
}

#bg-video{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-1;
}

.auth-container{
    max-width:450px;
    margin:60px auto;
    padding:30px;
    border-radius:20px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.2);
    color:white;
}

.form-control{
    background:rgba(255,255,255,0.2);
    border:none;
    color:white;
}

.form-control::placeholder{
    color:#ddd;
}

.form-control:focus{
    background:rgba(255,255,255,0.3);
    color:white;
    box-shadow:none;
}

.form-toggle{
    color:#00d9ff;
    cursor:pointer;
}

.error-message{
    color:#ffb3b3;
    font-size:14px;
}
</style>
</head>

<body>

<video autoplay loop muted playsinline id="bg-video">
    <source src="https://res.cloudinary.com/dasm9k1z9/video/upload/v1706845125/wjlymhfjxiqtc7qn1nqi.mp4" type="video/mp4">
</video>

<div class="container">
<div class="auth-container">

<h2 class="text-center mb-4" id="form-title">Sign Up</h2>

<form id="signup-form">

<div class="mb-3">
<label>Full Name</label>
<input type="text" class="form-control" id="signup-name" placeholder="Enter name" required>
<div class="error-message" id="name-error"></div>
</div>

<div class="mb-3">
<label>Email</label>
<input type="email" class="form-control" id="signup-email" placeholder="Enter email" required>
<div class="error-message" id="email-error"></div>
</div>

<div class="mb-3">
<label>Password</label>
<input type="password" class="form-control" id="signup-password" placeholder="Enter password" required>
<div class="error-message" id="password-error"></div>
</div>

<div class="mb-3">
<label>Confirm Password</label>
<input type="password" class="form-control" id="signup-confirm-password" placeholder="Confirm password" required>
<div class="error-message" id="confirm-password-error"></div>
</div>

<button type="submit" class="btn btn-primary w-100">Sign Up</button>

</form>

<form id="signin-form" style="display:none;">

<div class="mb-3">
<label>Email</label>
<input type="email" class="form-control" id="signin-email" placeholder="Enter email" required>
</div>

<div class="mb-3">
<label>Password</label>
<input type="password" class="form-control" id="signin-password" placeholder="Enter password" required>
</div>

<button type="submit" class="btn btn-primary w-100">Sign In</button>

</form>

<div class="text-center mt-3" id="toggle-form-text">
Already have an account?
<span class="form-toggle">Sign In</span>
</div>

<div class="alert mt-3" id="auth-alert" style="display:none;"></div>

</div>
</div>

<script src="script.js"></script>

</body>
</html>
